<!doctype html>
<meta charset="utf-8" />
<title>Create the bothub GitHub App</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; }
</style>
<h1>Create the bothub GitHub App</h1>
<div id="start">
  <p>Posts <code>app-manifest.json</code> to GitHub. Leave the organization empty to create the app on your account.</p>
  <form id="form" method="post">
    <label>Organization <input id="org" placeholder="optional" /></label>
    <input type="hidden" name="manifest" id="manifest" />
    <button>Create on GitHub</button>
  </form>
</div>
<div id="done" hidden>
  <p>GitHub returned a code. Within one hour, exchange it for the app id, private key and webhook secret:</p>
  <pre id="command"></pre>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code && params.get('state') !== sessionStorage.getItem('bothub-state')) {
    document.body.textContent = 'State mismatch, start again.';
  } else if (code) {
    document.getElementById('start').hidden = true;
    document.getElementById('done').hidden = false;
    document.getElementById('command').textContent =
      `(umask 077; curl -fsS -X POST https://api.github.com/app-manifests/${encodeURIComponent(code)}/conversions > ~/.bothub/github-app.json)`;
  } else {
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const manifest = await (await fetch('app-manifest.json')).text();
      const state = crypto.randomUUID();
      sessionStorage.setItem('bothub-state', state);
      const org = document.getElementById('org').value.trim();
      const base = org
        ? `https://github.com/organizations/${encodeURIComponent(org)}/settings/apps/new`
        : 'https://github.com/settings/apps/new';
      document.getElementById('manifest').value = manifest;
      e.target.action = `${base}?state=${state}`;
      e.target.submit();
    });
  }
</script>
