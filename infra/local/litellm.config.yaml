# Model aliases bots ask for. Upstream model IDs come from the environment (see .env.example).
# For a fully offline run, switch to litellm.offline.yaml (LITELLM_CONFIG in .env).
#
# Clients:
#   OpenAI style (opencode, pi, codex)  BOTHUB_LLM_BASE_URL=http://127.0.0.1:4000  (http://litellm:4000 in a sandbox)
#   Anthropic style (claude-code)       ANTHROPIC_BASE_URL=<same>, ANTHROPIC_AUTH_TOKEN=<virtual key>, no ANTHROPIC_API_KEY

model_list:
  # ChatGPT subscription through the chatgpt/ provider. Tokens come from the device login
  # (README) and live in $CHATGPT_TOKEN_DIR. Spend is reported as $0, so key budgets do not
  # apply here; per-key rpm/tpm and bothub's runs-per-day budget are the limits.
  - model_name: smart
    model_info: { mode: responses }
    litellm_params:
      model: os.environ/BOTHUB_MODEL_SMART

  - model_name: writer
    model_info: { mode: responses }
    litellm_params:
      model: os.environ/BOTHUB_MODEL_WRITER

  # A different model family, so review does not share the author's blind spots.
  - model_name: review
    litellm_params:
      model: os.environ/BOTHUB_MODEL_REVIEW
      api_key: os.environ/ANTHROPIC_API_KEY

  # Local models through Ollama.
  - model_name: fast
    litellm_params:
      model: os.environ/BOTHUB_MODEL_LOCAL
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: local
    litellm_params:
      model: os.environ/BOTHUB_MODEL_LOCAL
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
