Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 256
LogLevel Connect
DisableViaHeader Yes

# Deny everything except the hosts matched by the allowlist (extended regex on the host name).
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"

# CONNECT (HTTPS) only to 443.
ConnectPort 443
