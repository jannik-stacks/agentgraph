Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 256
LogLevel Connect
DisableViaHeader Yes

# Deny every host but those in the merged allowlist that start.sh writes (extended regex on the host name).
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/tmp/allowlist"

# CONNECT (HTTPS) only to 443.
ConnectPort 443
