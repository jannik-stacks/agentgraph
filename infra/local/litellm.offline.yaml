# Every alias on the local Ollama model, for fully offline simulation.
# Use it with LITELLM_CONFIG=litellm.offline.yaml in .env, then `docker compose up -d litellm`.

model_list:
  - model_name: local
    litellm_params: &local
      model: os.environ/AGENTGRAPH_MODEL_LOCAL
      api_base: os.environ/OLLAMA_API_BASE
      think: false
  - { model_name: fast, litellm_params: *local }
  - { model_name: smart, litellm_params: *local }
  - { model_name: writer, litellm_params: *local }
  - { model_name: luna, litellm_params: *local }
  - { model_name: glm, litellm_params: *local }
  - { model_name: glm-flash, litellm_params: *local }
  - { model_name: deepseek, litellm_params: *local }
  - { model_name: deepseek-flash, litellm_params: *local }
  - { model_name: minimax, litellm_params: *local }
  - { model_name: gemini, litellm_params: *local }
  - { model_name: gemini-flash, litellm_params: *local }
  - { model_name: grok, litellm_params: *local }
  - { model_name: grok-build, litellm_params: *local }
  - { model_name: qwen, litellm_params: *local }
  - { model_name: qwen-flash, litellm_params: *local }
  - { model_name: kimi, litellm_params: *local }
  - { model_name: muse, litellm_params: *local }
  - { model_name: muse-flash, litellm_params: *local }

litellm_settings:
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
