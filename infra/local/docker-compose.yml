# Local agentgraph stack. Every published port binds to 127.0.0.1. Profiles: default (litellm + postgres),
# sandbox (egress allowlist proxy, Ollama relay), ollama (Ollama in a container, for Linux).
# Images are pinned by digest; re-pin with docker buildx imagetools inspect <image>:<tag>.

name: agentgraph

services:
  # Fixed container names make a second project on the same volumes fail at create.
  litellm:
    container_name: agentgraph-litellm
    # PyPI releases 1.82.7 and 1.82.8 were malicious; only ever run the image, pinned by digest.
    image: ghcr.io/berriai/litellm-database:v1.106.2@sha256:35f2cec3a14bb297e08bfab56c1fc377432bc4071aaf71978fdff043a5d91e79
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["127.0.0.1:4000:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in infra/local/.env}
      # Unset unless .env sets it; LiteLLM then encrypts with the master key.
      LITELLM_SALT_KEY:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm-local}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENTGRAPH_MODEL_SMART: ${AGENTGRAPH_MODEL_SMART:-chatgpt/gpt-6.1-sol}
      AGENTGRAPH_MODEL_WRITER: ${AGENTGRAPH_MODEL_WRITER:-chatgpt/gpt-6.1-sol}
      AGENTGRAPH_MODEL_LOCAL: ${AGENTGRAPH_MODEL_LOCAL:-ollama_chat/qwen3.5:4b}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # The ChatGPT refresh token is single use: never point two LiteLLM instances at this store.
      CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt
    volumes:
      - ./${LITELLM_CONFIG:-litellm.config.yaml}:/app/config.yaml:ro
      - chatgpt-auth:/var/lib/litellm/chatgpt
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      db: {}
      egress: {}
      sandbox: { aliases: [gateway] }
      models: { aliases: [gateway] }
    restart: unless-stopped

  postgres:
    container_name: agentgraph-postgres
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [db]
    restart: unless-stopped

  egress: &egress
    profiles: [sandbox]
    build: ./egress
    image: agentgraph-egress:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 512
    networks: [sandbox, egress]

  # Gives run containers the Ollama decision API (/v1/systemone) on the host, port 11434 only, as ollama.internal:
  # Ollama answers 403 to host names outside localhost, private addresses and .internal, .local or .localhost names.
  ollama-relay:
    <<: *egress
    entrypoint: ["socat", "TCP-LISTEN:11434,fork,reuseaddr", "TCP:${OLLAMA_HOST_ADDR:-host.docker.internal:11434}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 32m
    pids_limit: 64
    networks:
      sandbox: { aliases: [ollama.internal] }
      egress: {}

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
    networks: [egress]
    restart: unless-stopped

networks:
  db:
    name: agentgraph-db
    internal: true
  egress:
    name: agentgraph-egress
  sandbox:
    name: agentgraph-sandbox
    internal: true
  # For graphs with network: models. The model proxy is the only thing on it.
  models:
    name: agentgraph-models
    internal: true

volumes:
  pgdata:
    name: agentgraph-pgdata
  chatgpt-auth:
    name: agentgraph-chatgpt-auth
  ollama-models:
    name: agentgraph-ollama-models
